function loadDeals() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_DEALS));
  return JSON.parse(JSON.stringify(DEMO_DEALS));
}

function saveDeals(deals) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deals));
}

let deals = loadDeals();

// ============================================================
// SCORING ENGINE
// ============================================================
function coInvestorScore(coInvestors) {
  if (!coInvestors || coInvestors.length === 0) return 0;
  const weights = { High: 10, Medium: 6, Low: 2 };
  const scores = coInvestors.map(c => weights[c.interest] || 0);
  const avg = scores.reduce((a,b) => a+b, 0) / scores.length;
  return Math.min(10, avg);
}

function computeScore(deal) {
  const ci = coInvestorScore(deal.coInvestors);
  const score =
    (deal.industrialNeed   || 0) * 0.25 +
    (deal.devPerformance   || 0) * 0.25 +
    (deal.team             || 0) * 0.15 +
    (deal.market           || 0) * 0.10 +
    (deal.businessModel    || 0) * 0.10 +
    (deal.ip               || 0) * 0.05 +
    (deal.regulatory       || 0) * 0.05 +
    ci                           * 0.05;
  return Math.round(score * 10) / 10;
}

function scoreBadge(score) {
  const cls = score >= 7 ? 'score-green' : score >= 5 ? 'score-orange' : 'score-red';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-sm font-semibold ${cls}">${score.toFixed(1)}</span>`;
}

function stageBadge(stage) {
  const map = {
    'Sourcing': 'stage-sourcing',
    'Due Diligence': 'stage-dd',
    'Term Sheet': 'stage-ts',
    'Closed': 'stage-closed',
    'Rejected': 'stage-rejected'
  };
  const cls = map[stage] || 'bg-slate-100 text-slate-600';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}">${stage}</span>`;
}

function navigate(page, dealId) {
  pages.forEach(p => {

    const nav = document.getElementById('nav-' + p);
    if (nav) nav.classList.remove('active');
  });
  document.getElementById('page-' + page).classList.remove('hidden');
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');

  switch(page) {
    case 'dashboard': renderDashboard(); break;
    case 'pipeline':  renderPipeline(); break;
    case 'new':       renderForm(null); break;
    case 'priority':  renderPriority(); break;
    case 'team':      renderTeam(); break;
  }
}

function thBtn(col, label) {
  const active = pipelineSort.col === col;
  const arrow = active ? (pipelineSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th class="px-4 py-3 font-medium cursor-pointer hover:text-indigo-600 select-none" onclick="sortPipeline('${col}')">${label}${arrow}</th>`;
}

function sortPipeline(col) {
  if (pipelineSort.col === col) {
    pipelineSort.dir = pipelineSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    pipelineSort.col = col;
    pipelineSort.dir = col === 'score' ? 'desc' : 'asc';
  }
  renderPipeline();
}

function renderPipelineTable() {
  deals = loadDeals();
  const search = (document.getElementById('pipeline-search')?.value || pipelineFilter).toLowerCase();
  const stageF = document.getElementById('pipeline-stage-filter')?.value || '';

  let filtered = deals.filter(d => {
    const matchSearch = !search || d.company.toLowerCase().includes(search) || d.sector.toLowerCase().includes(search);
    const matchStage = !stageF || d.stage === stageF;
    return matchSearch && matchStage;
  });

  const col = pipelineSort.col;
  const dir = pipelineSort.dir === 'asc' ? 1 : -1;
  filtered.sort((a,b) => {
    let va, vb;
    if (col === 'score') { va = computeScore(a); vb = computeScore(b); }
    else if (col === 'trl') { va = a.trl; vb = b.trl; }
    else if (col === 'investment') { va = a.investmentAmount || 0; vb = b.investmentAmount || 0; }
    else { va = (a[col]||'').toLowerCase(); vb = (b[col]||'').toLowerCase(); }
    return va < vb ? -dir : va > vb ? dir : 0;
  });

  const tbody = document.getElementById('pipeline-tbody');
  if (!tbody) return;
  tbody.innerHTML = filtered.map(d => {
    const score = computeScore(d);
    const amt = d.investmentAmount ? '€' + Number(d.investmentAmount).toLocaleString('it-IT') : '–';
    return `
    <tr class="border-b border-slate-100 hover:bg-slate-50 cursor-pointer" onclick="openDeal('${d.id}')">
      <td class="px-4 py-3 font-medium text-slate-800">${d.company}</td>
      <td class="px-4 py-3 text-slate-600">${d.sector}</td>
      <td class="px-4 py-3"><span class="bg-indigo-100 text-indigo-700 text-xs font-medium px-2 py-0.5 rounded">TRL ${d.trl}</span></td>
      <td class="px-4 py-3">${stageBadge(d.stage)}</td>
      <td class="px-4 py-3 text-slate-700">${amt}</td>
      <td class="px-4 py-3">${scoreBadge(score)}</td>
      <td class="px-4 py-3">
        <div class="flex gap-2" onclick="event.stopPropagation()">
          <button onclick="openDeal('${d.id}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium transition-colors">Apri</button>
          <button onclick="confirmDelete('${d.id}')" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 px-2 py-1 rounded font-medium transition-colors">Elimina</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-400">Nessun deal trovato</td></tr>';
  }
}

function renderPriority() {

        ${sorted.map((d,i) => {

          const scoreBar = Math.round(score / 10 * 100);

          return `

            <div class="flex items-start gap-4">
              <div class="text-2xl font-bold text-slate-300 w-8 text-center mt-1">#${i+1}</div>

                </div>
                <div class="text-sm text-slate-500 mb-3">${d.sector} · <span class="bg-indigo-100 text-indigo-700 text-xs font-medium px-1.5 py-0.5 rounded">TRL ${d.trl}</span></div>

                  <div class="flex justify-between"><span>Team</span><span class="font-medium">${d.team}/10</span></div>
                  <div class="flex justify-between"><span>Mercato</span><span class="font-medium">${d.market}/10</span></div>
                </div>

                <div class="w-full bg-slate-100 rounded-full h-2 mb-3">

                </div>

                  <button onclick="quickStage('${d.id}')" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 px-3 py-1.5 rounded-lg font-medium transition-colors">Avanza Stage</button>
                </div>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function quickStage(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;
  const order = ['Sourcing','Due Diligence','Term Sheet','Closed'];
  const idx = order.indexOf(d.stage);
  if (idx >= 0 && idx < order.length - 1) {
    d.stage = order[idx + 1];
    saveDeals(deals);
    renderPriority();
  }
}

function criterionSlider(name, label, weight, value, justName, justPlaceholder, justValue) {
  return `
  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-600 mb-1">
      ${label} <span class="text-xs text-slate-400">(${weight})</span>: <span id="${name}-val" class="text-indigo-600 font-bold">${value}</span>/10
    </label>
    <input type="range" name="${name}" min="0" max="10" value="${value}" class="w-full mb-2" oninput="document.getElementById('${name}-val').textContent=this.value; updateLiveScore()">
    <textarea name="${justName}" rows="2" placeholder="${justPlaceholder}..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none">${esc(justValue||'')}</textarea>
  </div>`;
}

function simpleSlider(name, label, weight, value) {
  return `
  <div>
    <label class="block text-sm font-medium text-slate-600 mb-1">
      ${label} <span class="text-xs text-slate-400">(${weight})</span>: <span id="${name}-val" class="text-indigo-600 font-bold">${value}</span>/10
    </label>
    <input type="range" name="${name}" min="0" max="10" value="${value}" class="w-full" oninput="document.getElementById('${name}-val').textContent=this.value; updateLiveScore()">
  </div>`;
}

function toggleSourceName() {
  const type = document.getElementById('form-source-type').value;
  const wrap = document.getElementById('source-name-wrap');
  wrap.classList.toggle('hidden', type === 'Internal');
}

const TRL_LABELS = {
  1: 'Principi di base osservati',
  2: 'Concetto tecnologico formulato',
  3: 'Proof of concept sperimentale',
  4: 'Tecnologia validata in laboratorio',
  5: 'Tecnologia validata in ambiente rilevante',
  6: 'Prototipo dimostrativo',
  7: 'Prototipo in ambiente operativo',
  8: 'Sistema completo e qualificato',
  9: 'Sistema in operatività reale'
};

function updateTRL(val) {
  const v = document.getElementById('trl-val');
  const l = document.getElementById('trl-label');
  if (v) v.textContent = val;
  if (l) l.textContent = TRL_LABELS[val] || '';
}

function setupLiveScore() {
  document.querySelectorAll('#deal-form input[type=range]').forEach(el => {
    el.addEventListener('input', updateLiveScore);
  });
  updateLiveScore();
}

function updateLiveScore() {
  const form = document.getElementById('deal-form');
  if (!form) return;
  const g = name => parseFloat(form.querySelector(`[name="${name}"]`)?.value || 0);
  const score =
    g('industrialNeed') * 0.25 +
    g('devPerformance') * 0.25 +
    g('team') * 0.15 +
    g('market') * 0.10 +
    g('businessModel') * 0.10 +
    g('ip') * 0.05 +
    g('regulatory') * 0.05;
  const el = document.getElementById('live-score');
  if (el) el.textContent = score.toFixed(1) + '/10';
}

// Save
function saveDeal(e) {
  e.preventDefault();
  deals = loadDeals();
  const form = document.getElementById('deal-form');
  const fd = new FormData(form);

  const g = name => fd.get(name) || '';
  const gi = name => parseInt(fd.get(name)) || 0;

  const deal = {
    id: editingDeal ? editingDeal.id : 'deal-' + Date.now(),
    company: g('company'),
    sector: g('sector'),
    description: g('description'),
    pipelineSource: g('pipelineSource'),
    sourceName: g('sourceName'),
    useOfInvestment: fd.getAll('useOfInvestment'),
    useOfInvestmentNotes: g('useOfInvestmentNotes'),
    trl: gi('trl'),
    industrialNeed: gi('industrialNeed'),
    industrialNeedJustification: g('industrialNeedJustification'),
    devPerformance: gi('devPerformance'),
    devPerformanceJustification: g('devPerformanceJustification'),
    team: gi('team'),
    market: gi('market'),
    businessModel: gi('businessModel'),
    ip: gi('ip'),
    regulatory: gi('regulatory'),
    coInvestors: formCoInvestors,
    capTable: formCapTable,
    investmentAmount: parseFloat(fd.get('investmentAmount')) || 0,
    valuation: parseFloat(fd.get('valuation')) || 0,
    instrument: g('instrument'),
    stage: g('stage'),
    notes: g('notes'),
    tasks: editingDeal ? (editingDeal.tasks || []) : (formTasks || []),
    files: editingDeal ? (editingDeal.files || []) : (formFiles || [])
  };

  if (editingDeal) {
    const idx = deals.findIndex(d => d.id === editingDeal.id);
    deals[idx] = deal;
  } else {
    deals.push(deal);
  }
  saveDeals(deals);
  navigate('pipeline');
}

function editDeal(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;

  // Show the new page
  pages.forEach(p => {
    document.getElementById('page-' + p).classList.add('hidden');
    const nav = document.getElementById('nav-' + p);
    if (nav) nav.classList.remove('active');
  });
  document.getElementById('page-new').classList.remove('hidden');
  const navNew = document.getElementById('nav-new');
  if (navNew) navNew.classList.add('active');
  const navPipeline = document.getElementById('nav-pipeline');
  if (navPipeline) navPipeline.classList.add('active');
  renderForm(id);
}

function confirmDelete(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;
  if (confirm(`Eliminare il deal "${d.company}"? L'operazione non è reversibile.`)) {
    const newDeals = deals.filter(x => x.id !== id);
    saveDeals(newDeals);
    deals = newDeals;
    renderPipeline();
  }
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx >= 0) { deals[idx].tasks = JSON.parse(JSON.stringify(formTasks)); saveDeals(deals); editingDeal = deals[idx]; }
}

// ============================================================
// FILES (per deal)
// ============================================================
const FILE_WARN_BYTES = 4 * 1024 * 1024;

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function totalFilesSize() {
  return formFiles.reduce((s,f) => s + (f.size||0), 0);
}
function updateFilesWarning() {
  const el = document.getElementById('files-size-warning');
  if (!el) return;
  const tot = totalFilesSize();
  if (tot > FILE_WARN_BYTES) {
    el.innerHTML = `<span class="text-red-600 font-medium">Attenzione: ${fmtBytes(tot)} totali — vicino al limite localStorage</span>`;
  } else {
    el.textContent = `Totale: ${fmtBytes(tot)}`;
  }
}
function renderFilesList() {
  const el = document.getElementById('files-list');
  if (!el) return;
  updateFilesWarning();
  if (formFiles.length === 0) {
    el.innerHTML = '<p class="text-sm text-slate-400 italic">Nessun documento caricato</p>';
    return;
  }
  el.innerHTML = formFiles.map((f, i) => `
    <div class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg">
      <svg class="w-5 h-5 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-slate-700 truncate">${esc(f.name)}</div>
        <div class="text-xs text-slate-400">${fmtBytes(f.size||0)} · ${new Date(f.uploadedAt).toLocaleDateString('it-IT')}</div>
      </div>
      <a href="${f.dataUrl}" download="${esc(f.name)}" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium">Scarica</a>
      <button type="button" onclick="removeFile(${i})" class="text-red-400 hover:text-red-600 p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');
}
function handleFileDrop(e) {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files) processFiles(e.dataTransfer.files);
}
function handleFileSelect(e) {
  processFiles(e.target.files);
  e.target.value = '';
}
function processFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      formFiles.push({
        name: file.name,
        type: file.type,
        size: file.size,
        dataUrl: ev.target.result,
        uploadedAt: new Date().toISOString()
      });
      persistFilesOnDeal();
      renderFilesList();
    };
    reader.readAsDataURL(file);
  });
}
function removeFile(i) { formFiles.splice(i,1); persistFilesOnDeal(); renderFilesList(); }
function persistFilesOnDeal() {
  if (!editingDeal) return;
  try {
    deals = loadDeals();
    const idx = deals.findIndex(d => d.id === editingDeal.id);
    if (idx >= 0) { deals[idx].files = JSON.parse(JSON.stringify(formFiles)); saveDeals(deals); editingDeal = deals[idx]; }
  } catch (err) {
    alert('Errore salvataggio file: ' + err.message + '\nProbabilmente hai raggiunto il limite di localStorage.');
  }
}

// TEAM
// ============================================================
const TEAM_KEY = 'dealflow_team';
const DEMO_TEAM = [
  { id: 'tm-001', name: 'Marco Bianchi', email: 'marco.bianchi@fondo.it', role: 'Partner', status: 'Active' },
  { id: 'tm-002', name: 'Giulia Rossi', email: 'giulia.rossi@fondo.it', role: 'Analyst', status: 'Active' },
  { id: 'tm-003', name: 'Luca Verdi', email: 'luca.verdi@fondo.it', role: 'Associate', status: 'Invited' }
];
function loadTeam() {
  const raw = localStorage.getItem(TEAM_KEY);
  if (raw) { try { return JSON.parse(raw); } catch(e) {} }
  localStorage.setItem(TEAM_KEY, JSON.stringify(DEMO_TEAM));
  return JSON.parse(JSON.stringify(DEMO_TEAM));
}
function saveTeam(t) { localStorage.setItem(TEAM_KEY, JSON.stringify(t)); }

  const el = document.getElementById('page-team');
  const team = loadTeam();

    const map = { 'Active':'bg-green-100 text-green-800', 'Invited':'bg-yellow-100 text-yellow-800', 'Inactive':'bg-slate-100 text-slate-600' };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${map[s]||'bg-slate-100'}">${s}</span>`;
  };
  el.innerHTML = `
    <div class="max-w-5xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-800 mb-1">Team</h1>
          <p class="text-slate-500 text-sm">Membri del team e gestione utenze</p>
        </div>
        <button onclick="openTeamModal(null)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Nuovo Membro
        </button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr class="text-left text-slate-600">
                <th class="px-4 py-3 font-medium">Nome</th>
                <th class="px-4 py-3 font-medium">Email</th>
                <th class="px-4 py-3 font-medium">Ruolo</th>
                <th class="px-4 py-3 font-medium">Stato</th>
                <th class="px-4 py-3 font-medium">Azioni</th>
              </tr>
            </thead>
            <tbody>
              ${team.length === 0 ? '<tr><td colspan="5" class="text-center py-12 text-slate-400">Nessun membro nel team</td></tr>' :
                team.map(m => `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                  <td class="px-4 py-3 font-medium text-slate-800">${esc(m.name)}</td>
                  <td class="px-4 py-3 text-slate-600">${esc(m.email)}</td>
                  <td class="px-4 py-3 text-slate-600">${esc(m.role)}</td>
                  <td class="px-4 py-3">${statusBadge(m.status)}</td>
                  <td class="px-4 py-3">
                    <div class="flex gap-2 flex-wrap">
                      ${m.status !== 'Inactive' ? `<button onclick="toggleTeamStatus('${m.id}')" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 px-2 py-1 rounded font-medium">${m.status==='Active'?'Disattiva utenza':'Attiva utenza'}</button>` : `<button onclick="toggleTeamStatus('${m.id}')" class="text-xs bg-green-50 hover:bg-green-100 text-green-700 px-2 py-1 rounded font-medium">Riattiva</button>`}
                      <button onclick="openTeamModal('${m.id}')" class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-700 px-2 py-1 rounded font-medium">Modifica</button>
                      <button onclick="deleteTeamMember('${m.id}')" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 px-2 py-1 rounded font-medium">Elimina</button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}
function openTeamModal(id) {
  const team = loadTeam();
  const m = id ? team.find(x => x.id === id) : null;
  const body = document.getElementById('team-modal-body');
  body.innerHTML = `
    <div class="p-6 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-800">${m ? 'Modifica Membro' : 'Nuovo Membro'}</h2>
      <button onclick="closeTeamModal()" class="text-slate-400 hover:text-slate-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form onsubmit="saveTeamMember(event, '${m?m.id:''}')" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Nome *</label>
        <input name="name" type="text" required value="${esc(m?m.name:'')}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Email *</label>
        <input name="email" type="email" required value="${esc(m?m.email:'')}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Ruolo</label>
          <select name="role" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            ${['Partner','Analyst','Associate','Advisor','External'].map(r => `<option value="${r}" ${m&&m.role===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Stato</label>
          <select name="status" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            ${['Active','Invited','Inactive'].map(s => `<option value="${s}" ${m&&m.status===s?'selected':(!m&&s==='Invited'?'selected':'')}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="closeTeamModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Annulla</button>
        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Salva</button>
      </div>
    </form>
  `;
  document.getElementById('team-modal-overlay').classList.remove('hidden');
}
function closeTeamModal() { document.getElementById('team-modal-overlay').classList.add('hidden'); }
function saveTeamMember(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const team = loadTeam();
  if (id) {
    const idx = team.findIndex(x => x.id === id);
    if (idx >= 0) team[idx] = { ...team[idx], name: fd.get('name'), email: fd.get('email'), role: fd.get('role'), status: fd.get('status') };
  } else {
    team.push({ id: 'tm-'+Date.now(), name: fd.get('name'), email: fd.get('email'), role: fd.get('role'), status: fd.get('status') });
  }
  saveTeam(team);
  closeTeamModal();
  renderTeam();
}
function toggleTeamStatus(id) {
  const team = loadTeam();
  const m = team.find(x => x.id === id);
  if (!m) return;
  if (m.status === 'Active') m.status = 'Invited';
  else m.status = 'Active';
  saveTeam(team);
  renderTeam();
}
function deleteTeamMember(id) {
  const team = loadTeam();
  const m = team.find(x => x.id === id);
  if (!m) return;
  if (confirm(`Eliminare il membro "${m.name}"?`)) {
    saveTeam(team.filter(x => x.id !== id));
    renderTeam();
  }
}
