function loadDeals() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DEMO_DEALS));
  return JSON.parse(JSON.stringify(DEMO_DEALS));
}

function saveDeals(deals) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deals));
}

let deals = loadDeals();

// ============================================================
// SCORING ENGINE
// ============================================================
function coInvestorScore(coInvestors) {
  if (!coInvestors || coInvestors.length === 0) return 0;
  const weights = { High: 10, Medium: 6, Low: 2 };
  const scores = coInvestors.map(c => weights[c.interest] || 0);
  const avg = scores.reduce((a,b) => a+b, 0) / scores.length;
  return Math.min(10, avg);
}

function evalScore(deal, key) {
  return (deal.evaluation && deal.evaluation.scores && deal.evaluation.scores[key]) || 5;
}
function computeScore(deal) {
  const ci = coInvestorScore(deal.coInvestors);
  const score =
    evalScore(deal, 'marketValidation')    * 0.25 +
    evalScore(deal, 'prototypePerformance')* 0.25 +
    evalScore(deal, 'ip')                  * 0.10 +
    evalScore(deal, 'team')                * 0.10 +
    evalScore(deal, 'investmentTarget')    * 0.05 +
    evalScore(deal, 'timeToMarket')        * 0.05 +
    evalScore(deal, 'coInvestorInterest')  * 0.05 +
    evalScore(deal, 'financialNeeds')      * 0.05 +
    evalScore(deal, 'risksImpact')         * 0.05 +
    ci                                     * 0.05;
  return Math.round(score * 10) / 10;
}

function scoreBadge(score) {
  const cls = score >= 7 ? 'score-green' : score >= 5 ? 'score-orange' : 'score-red';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-sm font-semibold ${cls}">${score.toFixed(1)}</span>`;
}

function stageBadge(stage) {
  const map = {
    'Sourcing': 'stage-sourcing',
    'Due Diligence': 'stage-dd',
    'Term Sheet': 'stage-ts',
    'Closed': 'stage-closed',
    'Rejected': 'stage-rejected'
  };
  const cls = map[stage] || 'bg-slate-100 text-slate-600';
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}">${stage}</span>`;
}

// ============================================================
// NAVIGATION
// ============================================================
const pages = ['dashboard', 'pipeline', 'new', 'portfolio', 'portfolio-detail', 'team', 'investors', 'industries', 'settings'];

function navigate(page, dealId) {
  pages.forEach(p => {
    document.getElementById('page-' + p).classList.add('hidden');
    const nav = document.getElementById('nav-' + p);
    if (nav) nav.classList.remove('active');
  });
  document.getElementById('page-' + page).classList.remove('hidden');
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');

  switch(page) {
    case 'dashboard':        renderDashboard(); break;
    case 'pipeline':         renderPipeline(); break;
    case 'new':              renderForm(null); break;
    case 'portfolio':        renderPortfolio(); break;
    case 'portfolio-detail': renderPortfolioDetail(dealId); break;
    case 'team':             renderTeam(); break;
    case 'investors':        renderInvestors(); break;
    case 'industries':       renderIndustries(); break;
    case 'settings':         renderSettings(); break;
  }
}

const YEARLY_TARGETS_KEY = 'dealflow_yearly_targets';
function loadYearlyTargets() {
  try { return JSON.parse(localStorage.getItem(YEARLY_TARGETS_KEY) || '{}'); } catch(e) { return {}; }
}
function saveYearlyTarget(year, phase, field, value) {
  const t = loadYearlyTargets();
  const k = year + '_' + phase;
  if (!t[k]) t[k] = {};
  t[k][field] = value;
  localStorage.setItem(YEARLY_TARGETS_KEY, JSON.stringify(t));
}

function thBtn(col, label) {
  const active = pipelineSort.col === col;
  const arrow = active ? (pipelineSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
  return `<th class="px-4 py-3 font-medium cursor-pointer hover:text-indigo-600 select-none" onclick="sortPipeline('${col}')">${label}${arrow}</th>`;
}

function sortPipeline(col) {
  if (pipelineSort.col === col) {
    pipelineSort.dir = pipelineSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    pipelineSort.col = col;
    pipelineSort.dir = col === 'score' ? 'desc' : 'asc';
  }
  renderPipeline();
}

function renderPipelineTable() {
  deals = loadDeals();
  const search = (document.getElementById('pipeline-search')?.value || pipelineFilter).toLowerCase();
  const stageF = document.getElementById('pipeline-stage-filter')?.value || '';

  let filtered = deals.filter(d => {
    const matchSearch = !search || d.company.toLowerCase().includes(search) || d.sector.toLowerCase().includes(search);
    const matchStage = !stageF || d.stage === stageF;
    return matchSearch && matchStage;
  });

  const col = pipelineSort.col;
  const dir = pipelineSort.dir === 'asc' ? 1 : -1;
  filtered.sort((a,b) => {
    let va, vb;
    if (col === 'score') { va = computeScore(a); vb = computeScore(b); }
    else if (col === 'trl') { va = a.trl; vb = b.trl; }
    else if (col === 'investment') { va = a.investmentAmount || 0; vb = b.investmentAmount || 0; }
    else { va = (a[col]||'').toLowerCase(); vb = (b[col]||'').toLowerCase(); }
    return va < vb ? -dir : va > vb ? dir : 0;
  });

  const tbody = document.getElementById('pipeline-tbody');
  if (!tbody) return;
  const team = loadTeam();
  const teamById = Object.fromEntries(team.map(m => [m.id, m]));
  tbody.innerHTML = filtered.map(d => {
    const score = computeScore(d);
    const amt = d.investmentAmount ? '€' + Number(d.investmentAmount).toLocaleString('it-IT') : '–';
    const lead = d.dealLead && teamById[d.dealLead] ? teamById[d.dealLead].name : '';
    const members = (d.dealTeam || []).filter(id => teamById[id]).map(id => teamById[id].name);
    const teamLine = lead || members.length
      ? `<div class="text-xs text-slate-500 mt-0.5">${lead ? '<span class="font-medium text-indigo-600">★ '+esc(lead)+'</span>' : ''}${lead && members.length ? ' · ' : ''}${members.length ? esc(members.slice(0,3).join(', ')) + (members.length>3?' +'+(members.length-3):'') : ''}</div>`
      : '';
    return `
    <tr class="border-b border-slate-100 hover:bg-slate-50 cursor-pointer" onclick="openDeal('${d.id}')">
      <td class="px-4 py-3 font-medium text-slate-800">${esc(d.company)}${teamLine}</td>
      <td class="px-4 py-3 text-slate-600">${d.sector}</td>
      <td class="px-4 py-3"><span class="bg-indigo-100 text-indigo-700 text-xs font-medium px-2 py-0.5 rounded">TRL ${d.trl}</span></td>
      <td class="px-4 py-3">${stageBadge(d.stage)}</td>
      <td class="px-4 py-3 text-slate-700">${amt}</td>
      <td class="px-4 py-3">${scoreBadge(score)}</td>
      <td class="px-4 py-3">
        <div class="flex gap-2" onclick="event.stopPropagation()">
          <button onclick="openDeal('${d.id}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium transition-colors">Apri</button>
          <button onclick="confirmDelete('${d.id}')" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 px-2 py-1 rounded font-medium transition-colors">Elimina</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-400">Nessun deal trovato</td></tr>';
  }
}

function quickStage(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;
  const order = ['Sourcing','Due Diligence','Term Sheet','Closed'];
  const idx = order.indexOf(d.stage);
  if (idx >= 0 && idx < order.length - 1) {
    d.stage = order[idx + 1];
    saveDeals(deals);
  }
}

function simpleSlider(name, label, weight, value) {

// ============================================================
// CONCEPT DEVELOPMENT HELPERS
// ============================================================
const CONCEPT_FIELD_KEYS = ['projectName','leadOrg','technology','product','trlJustification','keyEvidence','maturityGaps','nextTrlMilestone','intellectualProperty','problemStatement','valueProposition','tam','sam','som','roadmap','riskiestAssumptions'];
const CONCEPT_VALIDATION_FIELDS = ['problemStatement','valueProposition'];

// In-memory cache for concept data while form is open
let _conceptData = {};

function conceptInitFromDeal(d) {
  _conceptData = {
    fields: JSON.parse(JSON.stringify((d.concept&&d.concept.fields)||{})),
    approvals: JSON.parse(JSON.stringify((d.concept&&d.concept.approvals)||{})),
    comments: JSON.parse(JSON.stringify((d.concept&&d.concept.comments)||{})),
    validationStatus: JSON.parse(JSON.stringify((d.concept&&d.concept.validationStatus)||{}))
  };
}

function conceptSetField(key, val) {
  if (!_conceptData.fields) _conceptData.fields = {};
  _conceptData.fields[key] = val;
  // persist immediately if editing
  persistConceptOnDeal();
}

function persistConceptOnDeal() {
  if (!editingDeal) return;
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  deals[idx].concept = JSON.parse(JSON.stringify(_conceptData));
  saveDeals(deals);
  editingDeal = deals[idx];
}

function conceptApprove(key) {
  if (!_conceptData.approvals) _conceptData.approvals = {};
  const u = currentUser();
  if (!u) return;
  _conceptData.approvals[key] = { by: u.name, at: new Date().toISOString() };
  persistConceptOnDeal();
  renderConceptApprovalBar(key);
}

function conceptRevoke(key) {
  if (!_conceptData.approvals) _conceptData.approvals = {};
  delete _conceptData.approvals[key];
  persistConceptOnDeal();
  renderConceptApprovalBar(key);
}

function renderConceptApprovalBar(key) {
  const el = document.getElementById('concept-approval-' + key);
  if (!el) return;
  el.innerHTML = conceptApprovalBarInner(key);
}

function conceptApprovalBarInner(key) {
  const appr = _conceptData.approvals && _conceptData.approvals[key];
  if (appr) {
    const dt = new Date(appr.at);
    const dtStr = dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}) + ' ' + dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    return `<div class="flex items-center gap-2 mt-1">
      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Approvato da ${esc(appr.by)} · ${dtStr}
      </span>
      <button type="button" onclick="conceptRevoke('${key}')" class="text-xs text-slate-400 hover:text-red-500 underline">Revoca</button>
    </div>`;
  }
  return `<button type="button" onclick="conceptApprove('${key}')" class="mt-1 text-xs px-3 py-1 rounded border border-slate-200 bg-slate-50 hover:bg-green-50 hover:border-green-300 hover:text-green-700 text-slate-500 font-medium transition-colors">Approva</button>`;
}

function conceptApprovalBar(key, d) {
  // Called at render time from template literal — uses d.concept from deal, but also seeds _conceptData
  const appr = d.concept && d.concept.approvals && d.concept.approvals[key];
  if (appr) {
    const dt = new Date(appr.at);
    const dtStr = dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}) + ' ' + dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    return `<div id="concept-approval-${key}" class="flex items-center gap-2 mt-1">
      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Approvato da ${esc(appr.by)} · ${dtStr}
      </span>
      <button type="button" onclick="conceptRevoke('${key}')" class="text-xs text-slate-400 hover:text-red-500 underline">Revoca</button>
    </div>`;
  }

// Save
function saveDeal(e) {
  e.preventDefault();
  deals = loadDeals();
  const form = document.getElementById('deal-form');
  const fd = new FormData(form);

  const g = name => fd.get(name) || '';
  const gi = name => parseInt(fd.get(name)) || 0;

  // Collect evaluation fields from DOM
  const marketValidated = document.getElementById('mval-hidden') ? parseInt(document.getElementById('mval-hidden').value) === 9 : false;
  const marketValidationHow = (document.getElementById('mval-how-text') || {}).value || '';
  const prototypePerformanceText = (document.getElementById('eval-prototypePerformance') || {}).value || '';
  const evalSecondary = {};
  ['ip','team','investmentTarget','timeToMarket','coInvestorInterest','financialNeeds','risksImpact'].forEach(k => {
    const el = document.getElementById('eval-secondary-' + k);
    if (el) evalSecondary[k] = el.value;
  });

  const deal = {
    id: editingDeal ? editingDeal.id : 'deal-' + Date.now(),
    company: g('company'),
    sector: g('sector'),
    description: g('description'),
    pipelineSource: g('pipelineSource'),
    sourceName: g('sourceName'),
    useOfInvestment: fd.getAll('useOfInvestment'),
    useOfInvestmentNotes: g('useOfInvestmentNotes'),
    trl: gi('trl'),
    // industrialNeed derived from market validation toggle (B1)
    industrialNeed: marketValidated ? 9 : 3,
    industrialNeedJustification: marketValidationHow,
    devPerformance: gi('devPerformance'),
    devPerformanceJustification: prototypePerformanceText,
    team: gi('team'),
    teamJustification: '',
    market: gi('market'),
    marketJustification: '',
    competitiveAdvantage: gi('competitiveAdvantage'),
    competitiveAdvantageJustification: '',
    ip: gi('ip'),
    ipJustification: '',
    risks: gi('risks'),
    risksJustification: '',
    dealLead: g('dealLead'),
    dealTeam: fd.getAll('dealTeam'),
    coInvestors: formCoInvestors,
    capTable: formCapTable,
    investmentAmount: parseFloat(fd.get('investmentAmount')) || 0,
    valuation: parseFloat(fd.get('valuation')) || 0,
    instrument: g('instrument'),
    stage: g('stage'),
    notes: g('notes'),
    researchers: formResearchers,
    tasks: editingDeal ? (editingDeal.tasks || []) : (formTasks || []),
    files: editingDeal ? (editingDeal.files || []) : (formFiles || [])
  };

  // Preserve comments from prior state
  deal.comments = editingDeal ? (editingDeal.comments || []) : [];

  // Save concept data (from _conceptData in-memory cache)
  deal.concept = JSON.parse(JSON.stringify(_conceptData));

  // Collect evaluation scores from sliders
  const evalScoreKeys = ['marketValidation','prototypePerformance','ip','team','investmentTarget','timeToMarket','coInvestorInterest','financialNeeds','risksImpact'];
  const evalScores = {};
  evalScoreKeys.forEach(k => {
    const el = form.querySelector(`[name="evalScore_${k}"]`);
    evalScores[k] = el ? parseInt(el.value) || 5 : 5;
  });

  // Save evaluation data
  const priorEval = (editingDeal && editingDeal.evaluation) || {};
  deal.evaluation = {
    marketValidated,
    marketValidationHow,
    prototypePerformanceText,
    scores: evalScores,
    secondary: Object.assign({}, (priorEval.secondary || {}), evalSecondary),
    comments: priorEval.comments || {}
  };
  // Keep legacy fields in sync for backward compat
  deal.industrialNeed = evalScores.marketValidation;
  deal.devPerformance = evalScores.prototypePerformance;

  let stageChanged = false;
  let prevStage = '';
  if (editingDeal) {
    const idx = deals.findIndex(d => d.id === editingDeal.id);
    prevStage = deals[idx].stage;
    if (prevStage !== deal.stage) stageChanged = true;
    deals[idx] = deal;
  } else {
    deals.push(deal);
  }
  saveDeals(deals);
  if (stageChanged) {
    const recipients = new Set([...(deal.dealTeam||[]), deal.dealLead].filter(Boolean));
    const me = currentUser();
    recipients.forEach(uid => {
      if (me && uid === me.id) return;
      addNotification({
        userId: uid, type: 'deal_stage_change',
        title: 'Cambio stage deal',
        body: `${deal.company}: ${prevStage} → ${deal.stage}.`,
        dealId: deal.id
      });
    });
  }
  navigate('pipeline');
}

function editDeal(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;

  // Show the new page
  pages.forEach(p => {
    document.getElementById('page-' + p).classList.add('hidden');
    const nav = document.getElementById('nav-' + p);
    if (nav) nav.classList.remove('active');
  });
  document.getElementById('page-new').classList.remove('hidden');
  const navNew = document.getElementById('nav-new');
  if (navNew) navNew.classList.add('active');
  const navPipeline = document.getElementById('nav-pipeline');
  if (navPipeline) navPipeline.classList.add('active');
  renderForm(id);
}

function confirmDelete(id) {
  deals = loadDeals();
  const d = deals.find(x => x.id === id);
  if (!d) return;
  if (confirm(`Eliminare il deal "${d.company}"? L'operazione non è reversibile.`)) {
    const newDeals = deals.filter(x => x.id !== id);
    saveDeals(newDeals);
    deals = newDeals;
    renderPipeline();
  }
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function criterionBlock(key, label, weight, value, justName, justPlaceholder, justValue, deal) {
  return `
  <div class="mb-5 pb-4 border-b border-slate-100 last:border-b-0">
    <label class="block text-sm font-medium text-slate-600 mb-1">
      ${label} <span class="text-xs text-slate-400">(${weight})</span>: <span id="${key}-val" class="text-indigo-600 font-bold">${value}</span>/10
    </label>
    <input type="range" name="${key}" min="0" max="10" value="${value}" class="w-full mb-2" oninput="document.getElementById('${key}-val').textContent=this.value; updateLiveScore()">
    <textarea name="${justName}" rows="2" placeholder="${justPlaceholder}..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none mb-3">${esc(justValue||'')}</textarea>

    <details class="mb-2 bg-slate-50 rounded-lg border border-slate-200" ${(deal && ((deal.tasks||[]).some(t=>t.criterion===key) || (deal.comments||[]).some(c=>c.criterion===key))) ? 'open' : ''}>
      <summary class="cursor-pointer px-3 py-2 text-xs font-semibold text-slate-600 select-none flex items-center justify-between">
        <span>Task & Discussione</span>
        <span class="text-slate-400 font-normal">${((deal&&deal.tasks)||[]).filter(t=>t.criterion===key).length} task · ${((deal&&deal.comments)||[]).filter(c=>c.criterion===key).length} commenti</span>
      </summary>
      <div class="p-3 space-y-3 border-t border-slate-200">
        <div>
          <div class="flex items-center justify-between mb-2">
            <h4 class="text-xs font-semibold text-slate-700 uppercase tracking-wide">Task per il criterio</h4>
            <button type="button" onclick="addCriterionTask('${key}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium">+ Aggiungi task</button>
          </div>
          <div id="crit-tasks-${key}" class="space-y-2"></div>
        </div>
        <div>
          <h4 class="text-xs font-semibold text-slate-700 uppercase tracking-wide mb-2">Discussione</h4>
          <div id="crit-comments-${key}" class="space-y-2 mb-2"></div>
          <div class="relative">
            <textarea id="crit-comment-input-${key}" rows="2" placeholder="Scrivi un commento... usa @ per menzionare un membro" oninput="onCommentInput(event,'${key}')" onkeydown="onCommentKeydown(event,'${key}')" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none bg-white"></textarea>
            <div id="mention-dd-${key}" class="hidden absolute z-30 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto w-64"></div>
            <div class="flex justify-end mt-1">
              <button type="button" onclick="postCriterionComment('${key}')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded font-medium">Pubblica</button>
            </div>
          </div>
        </div>
      </div>
    </details>
  </div>`;
}

function getDealForForm() {
  if (!editingDeal) return null;
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  return idx >= 0 ? deals[idx] : null;
}

function ensureDealLists(deal) {
  if (!deal.tasks) deal.tasks = [];
  if (!deal.comments) deal.comments = [];
}

function renderCriterionTasks(key) {
  const el = document.getElementById('crit-tasks-' + key);
  if (!el) return;
  const deal = getDealForForm();
  const tasks = deal ? (deal.tasks||[]).filter(t => t.criterion === key) : [];
  const team = loadTeam();
  if (tasks.length === 0) {
    el.innerHTML = '<p class="text-xs text-slate-400 italic">Nessun task per questo criterio</p>';
    return;
  }
  el.innerHTML = tasks.map(t => {
    const done = t.status === 'Done';
    const prCol = t.priority === 'High' ? 'bg-red-50 text-red-700' : t.priority === 'Low' ? 'bg-slate-50 text-slate-600' : 'bg-orange-50 text-orange-700';
    return `
    <div class="flex flex-wrap items-center gap-2 p-2 bg-white border border-slate-200 rounded">
      <input type="checkbox" ${done?'checked':''} onchange="toggleCriterionTaskDone('${t.id}','${key}')" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-300">
      <input type="text" value="${esc(t.title||'')}" placeholder="Titolo task" oninput="updateCriterionTask('${t.id}','title',this.value)" class="flex-1 min-w-32 border border-slate-200 rounded px-2 py-1 text-sm ${done?'line-through text-slate-400':''} focus:outline-none focus:ring-1 focus:ring-indigo-300">
      <select onchange="updateCriterionTask('${t.id}','assignee',this.value,true)" class="border border-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300">
        <option value="">— Assegnatario —</option>
        ${team.map(m => `<option value="${esc(m.id)}" ${t.assignee===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}
      </select>
      <input type="date" value="${esc(t.dueDate||'')}" onchange="updateCriterionTask('${t.id}','dueDate',this.value)" class="border border-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300">
      <select onchange="updateCriterionTask('${t.id}','status',this.value); renderCriterionTasks('${key}')" class="border border-slate-200 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-300">
        ${['To do','In progress','Done'].map(s => `<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select onchange="updateCriterionTask('${t.id}','priority',this.value)" class="border border-slate-200 rounded px-2 py-1 text-xs ${prCol} focus:outline-none focus:ring-1 focus:ring-indigo-300">
        ${['High','Med','Low'].map(p => `<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <button type="button" onclick="deleteCriterionTask('${t.id}','${key}')" class="text-red-400 hover:text-red-600 p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>`;
  }).join('');
}

function addCriterionTask(criterion) {
  if (!editingDeal) { alert('Salva prima il deal per aggiungere task.'); return; }
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  ensureDealLists(deals[idx]);
  const task = { id: 't-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), criterion, title:'', assignee:'', dueDate:'', status:'To do', priority:'Med' };
  deals[idx].tasks.push(task);
  saveDeals(deals);
  editingDeal = deals[idx];
  renderCriterionTasks(criterion);
}

function updateCriterionTask(taskId, field, value, notifyIfAssignee) {
  if (!editingDeal) return;
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  const t = (deals[idx].tasks||[]).find(x => x.id === taskId);
  if (!t) return;
  const prevAssignee = t.assignee;
  t[field] = value;
  saveDeals(deals);
  editingDeal = deals[idx];
  if (notifyIfAssignee && field === 'assignee' && value && value !== prevAssignee) {
    const team = loadTeam();
    const m = team.find(x => x.id === value);
    addNotification({
      userId: value,
      type: 'task_assigned',
      title: 'Nuovo task assegnato',
      body: `Ti è stato assegnato un task "${t.title||'(senza titolo)'}" su ${deals[idx].company} — criterio ${CRITERION_LABELS[t.criterion]||t.criterion}.`,
      dealId: deals[idx].id,
      criterion: t.criterion
    });
  }
}

function toggleCriterionTaskDone(taskId, criterion) {
  if (!editingDeal) return;
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  const t = (deals[idx].tasks||[]).find(x => x.id === taskId);
  if (!t) return;
  t.status = t.status === 'Done' ? 'To do' : 'Done';
  saveDeals(deals);
  editingDeal = deals[idx];
  renderCriterionTasks(criterion);
}

function deleteCriterionTask(taskId, criterion) {
  if (!editingDeal) return;
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  deals[idx].tasks = (deals[idx].tasks||[]).filter(x => x.id !== taskId);
  saveDeals(deals);
  editingDeal = deals[idx];
  renderCriterionTasks(criterion);
}

// --- Comments ---
function renderCriterionComments(key) {
  const el = document.getElementById('crit-comments-' + key);
  if (!el) return;
  const deal = getDealForForm();
  const comments = deal ? (deal.comments||[]).filter(c => c.criterion === key) : [];
  if (comments.length === 0) {
    el.innerHTML = '<p class="text-xs text-slate-400 italic">Nessun commento ancora. Avvia la discussione!</p>';
    return;
  }
  el.innerHTML = comments.map(c => {
    const ts = new Date(c.timestamp);
    const tsStr = ts.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}) + ' ' + ts.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const txt = esc(c.text||'').replace(/@([\w.\-]+)/g, '<span class="text-indigo-600 font-medium">@$1</span>');
    return `
    <div class="bg-white border border-slate-200 rounded-lg p-2.5">
      <div class="flex items-center justify-between mb-1">
        <div class="text-xs">
          <span class="font-semibold text-slate-700">${esc(c.authorName||'?')}</span>
          ${c.authorRole ? `<span class="text-slate-400 ml-1">· ${esc(c.authorRole)}</span>` : ''}
        </div>
        <span class="text-[10px] text-slate-400">${tsStr}</span>
      </div>
      <div class="text-sm text-slate-700 whitespace-pre-wrap leading-snug">${txt}</div>
    </div>`;
  }).join('');
}

function postCriterionComment(key) {
  if (!editingDeal) { alert('Salva prima il deal per commentare.'); return; }
  const ta = document.getElementById('crit-comment-input-' + key);
  if (!ta) return;
  const text = (ta.value||'').trim();
  if (!text) return;
  const u = currentUser();
  if (!u) return;
  const team = loadTeam();
  // Detect mentions
  const mentions = [];
  const re = /@([\w.\-]+)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const handle = m[1].toLowerCase();
    const found = team.find(x => (x.username||'').toLowerCase() === handle || memberSlug(x).toLowerCase() === handle);
    if (found && !mentions.includes(found.id)) mentions.push(found.id);
  }
  deals = loadDeals();
  const idx = deals.findIndex(d => d.id === editingDeal.id);
  if (idx < 0) return;
  ensureDealLists(deals[idx]);
  const comment = {
    id: 'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    criterion: key,
    authorId: u.id, authorName: u.name, authorRole: u.role,
    text, mentions, timestamp: new Date().toISOString()
  };
  deals[idx].comments.push(comment);
  saveDeals(deals);
  editingDeal = deals[idx];
  ta.value = '';
  hideMentionDropdown(key);
  renderCriterionComments(key);
  // Notify mentioned users
  mentions.forEach(uid => {
    if (uid === u.id) return;
    addNotification({
      userId: uid,
      type: 'mention',
      title: 'Sei stato menzionato',
      body: `${u.name} ti ha menzionato in un commento su ${deals[idx].company} (${CRITERION_LABELS[key]||key}): "${text.slice(0,80)}${text.length>80?'…':''}"`,
      dealId: deals[idx].id,
      criterion: key
    });
  });
  // Update header count of the details
  renderCriterionTasks(key); // no-op for tasks but refreshes
}

// --- @ Mention autocomplete ---
function onCommentInput(e, key) {
  const ta = e.target;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const match = before.match(/@([\w.\-]*)$/);
  if (!match) { hideMentionDropdown(key); return; }
  const q = match[1].toLowerCase();
  const team = loadTeam().filter(m => m.status !== 'Inactive');
  const matches = team.filter(m => {
    const u = (m.username||'').toLowerCase();
    const s = memberSlug(m).toLowerCase();
    const n = (m.name||'').toLowerCase();
    return !q || u.startsWith(q) || s.startsWith(q) || n.includes(q);
  }).slice(0, 8);
  const dd = document.getElementById('mention-dd-' + key);
  if (!dd || matches.length === 0) { hideMentionDropdown(key); return; }
  dd.innerHTML = matches.map(m => {
    const handle = m.username || memberSlug(m);
    return `<div onmousedown="event.preventDefault(); insertMention('${key}','${esc(handle)}')" class="px-3 py-1.5 hover:bg-indigo-50 cursor-pointer text-sm flex items-center gap-2">
      <span class="font-medium text-slate-700">@${esc(handle)}</span>
      <span class="text-xs text-slate-400">${esc(m.name)}</span>
    </div>`;
  }).join('');
  dd.classList.remove('hidden');
}
function onCommentKeydown(e, key) {
  if (e.key === 'Escape') hideMentionDropdown(key);
}
function hideMentionDropdown(key) {
  const dd = document.getElementById('mention-dd-' + key);
  if (dd) dd.classList.add('hidden');
}
function insertMention(key, handle) {
  const ta = document.getElementById('crit-comment-input-' + key);
  if (!ta) return;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const newBefore = before.replace(/@([\w.\-]*)$/, '@' + handle + ' ');
  ta.value = newBefore + after;
  const newPos = newBefore.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);
  hideMentionDropdown(key);
}

// ============================================================
// NOTIFICATIONS
// ============================================================
const NOTIF_KEY = 'dealflow_notifications';
const NOTIF_TYPE_TO_SETTING = {
  mention: 'mentions',
  task_assigned: 'tasksAssigned',
  task_due_soon: 'tasksDueSoon',
  deal_stage_change: 'stageChange',
  new_deal: 'newDeal'
};
function loadNotifications() {
  try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; }
}
function saveNotifications(list) { localStorage.setItem(NOTIF_KEY, JSON.stringify(list)); }
function userSettings(userId) {
  const def = { mentions:true, tasksAssigned:true, tasksDueSoon:true, stageChange:true, newDeal:true };
  try {
    const raw = localStorage.getItem('dealflow_settings_' + userId);
    if (!raw) return def;
    return { ...def, ...JSON.parse(raw) };
  } catch(e) { return def; }
}
function saveUserSettings(userId, s) {
  localStorage.setItem('dealflow_settings_' + userId, JSON.stringify(s));
}
function addNotification(n) {
  if (!n.userId) return;
  const settingKey = NOTIF_TYPE_TO_SETTING[n.type];
  if (settingKey) {
    const s = userSettings(n.userId);
    if (s[settingKey] === false) return;
  }
  const list = loadNotifications();
  list.unshift({
    id: 'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
    userId: n.userId,
    type: n.type,
    title: n.title,
    body: n.body,
    dealId: n.dealId || null,
    criterion: n.criterion || null,
    read: false,
    timestamp: new Date().toISOString()
  });
  // Cap at 200
  if (list.length > 200) list.length = 200;
  saveNotifications(list);
  refreshNotifBadge();
}
function refreshNotifBadge() {
  const u = currentUser();
  const badge = document.getElementById('notif-bell-badge');
  if (!badge) return;
  if (!u) { badge.classList.add('hidden'); return; }
  const cnt = loadNotifications().filter(n => n.userId === u.id && !n.read).length;
  if (cnt === 0) { badge.classList.add('hidden'); badge.textContent = ''; }
  else { badge.classList.remove('hidden'); badge.textContent = cnt > 99 ? '99+' : String(cnt); }
}
function toggleNotifPanel(e) {
  if (e) e.stopPropagation();
  const p = document.getElementById('notif-panel');
  if (p.classList.contains('hidden')) { renderNotifList(); p.classList.remove('hidden'); }
  else p.classList.add('hidden');
}
function closeNotifPanel() {
  document.getElementById('notif-panel').classList.add('hidden');
}
function renderNotifList() {
  const u = currentUser();
  const el = document.getElementById('notif-list');
  if (!el) return;
  if (!u) { el.innerHTML = '<p class="p-4 text-sm text-slate-400">Nessun utente</p>'; return; }
  const list = loadNotifications().filter(n => n.userId === u.id);
  if (list.length === 0) {
    el.innerHTML = '<p class="p-6 text-sm text-slate-400 text-center">Nessuna notifica</p>';
    return;
  }
  const typeIcon = {
    mention: '@', task_assigned: '✓', task_due_soon: '⏰', deal_stage_change: '⇄', new_deal: '★'
  };
  el.innerHTML = list.slice(0, 50).map(n => {
    const ts = new Date(n.timestamp);
    const tsStr = ts.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}) + ' ' + ts.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const ic = typeIcon[n.type] || '•';
    return `
    <div class="px-4 py-3 border-b border-slate-100 ${n.read?'bg-white':'bg-indigo-50/40'} hover:bg-slate-50 cursor-pointer" onclick="onNotifClick('${n.id}')">
      <div class="flex items-start gap-2">
        <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-bold flex-shrink-0">${ic}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <div class="text-sm font-semibold text-slate-700 truncate">${esc(n.title)}</div>
            ${n.read?'':'<span class="w-2 h-2 rounded-full bg-indigo-500 flex-shrink-0"></span>'}
          </div>
          <div class="text-xs text-slate-600 mt-0.5 leading-snug">${esc(n.body||'')}</div>
          <div class="flex items-center justify-between mt-1">
            <span class="text-[10px] text-slate-400">${tsStr}</span>
            ${n.read?'':`<button onclick="event.stopPropagation(); markNotifRead('${n.id}')" class="text-[10px] text-indigo-600 hover:text-indigo-800">Segna letta</button>`}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function onNotifClick(id) {
  const list = loadNotifications();
  const n = list.find(x => x.id === id);
  if (!n) return;
  n.read = true;
  saveNotifications(list);
  refreshNotifBadge();
  closeNotifPanel();
  if (n.dealId) {
    if (deals.findIndex(d => d.id === n.dealId) >= 0 || loadDeals().some(d => d.id === n.dealId)) {
      editDeal(n.dealId);
    }
  } else {
    renderNotifList();
  }
}
function markNotifRead(id) {
  const list = loadNotifications();
  const n = list.find(x => x.id === id);
  if (!n) return;
  n.read = true;
  saveNotifications(list);
  refreshNotifBadge();
  renderNotifList();
}
function markAllNotifRead() {
  const u = currentUser();
  if (!u) return;
  const list = loadNotifications();
  list.forEach(n => { if (n.userId === u.id) n.read = true; });
  saveNotifications(list);
  refreshNotifBadge();
  renderNotifList();
}
document.addEventListener('click', function(e) {
  const panel = document.getElementById('notif-panel');
  const btn = document.getElementById('notif-bell-btn');
  if (!panel || panel.classList.contains('hidden')) return;
  if (panel.contains(e.target) || (btn && btn.contains(e.target))) return;
  panel.classList.add('hidden');
});

// Generate task_due_soon notifications at app start (dedup by task id + date marker)
function generateDueSoonNotifications() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const horizon = new Date(today.getTime() + 3*24*60*60*1000);
  const allDeals = loadDeals();
  const existing = loadNotifications();
  // Build dedup set: type=task_due_soon dedup by `${taskId}|${YYYY-MM-DD}`
  const todayStr = today.toISOString().slice(0,10);
  const dedup = new Set(existing.filter(n => n.type==='task_due_soon').map(n => (n._dedupKey || '')));
  let changed = false;
  allDeals.forEach(d => {
    (d.tasks||[]).forEach(t => {
      if (!t.dueDate || !t.assignee) return;
      if (t.status === 'Done') return;
      const due = new Date(t.dueDate);
      if (isNaN(due.getTime())) return;
      due.setHours(0,0,0,0);
      if (due < today || due > horizon) return;
      const key = `${t.id}|${todayStr}`;
      if (dedup.has(key)) return;
      const s = userSettings(t.assignee);
      if (s.tasksDueSoon === false) return;
      existing.unshift({
        id: 'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),
        userId: t.assignee,
        type: 'task_due_soon',
        title: 'Task in scadenza',
        body: `Il task "${t.title||'(senza titolo)'}" su ${d.company} scade il ${due.toLocaleDateString('it-IT')}.`,
        dealId: d.id, criterion: t.criterion || null,
        read: false, timestamp: new Date().toISOString(),
        _dedupKey: key
      });
      dedup.add(key);
      changed = true;
    });
  });
  if (changed) {
    if (existing.length > 200) existing.length = 200;
    saveNotifications(existing);
  }
}

const FILE_WARN_BYTES = 4 * 1024 * 1024;

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function totalFilesSize() {
  return formFiles.reduce((s,f) => s + (f.size||0), 0);
}
function updateFilesWarning() {
  const el = document.getElementById('files-size-warning');
  if (!el) return;
  const tot = totalFilesSize();
  if (tot > FILE_WARN_BYTES) {
    el.innerHTML = `<span class="text-red-600 font-medium">Attenzione: ${fmtBytes(tot)} totali — vicino al limite localStorage</span>`;
  } else {
    el.textContent = `Totale: ${fmtBytes(tot)}`;
  }
}
function renderFilesList() {
  const el = document.getElementById('files-list');
  if (!el) return;
  updateFilesWarning();
  if (formFiles.length === 0) {
    el.innerHTML = '<p class="text-sm text-slate-400 italic">Nessun documento caricato</p>';
    return;
  }
  el.innerHTML = formFiles.map((f, i) => `
    <div class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg">
      <svg class="w-5 h-5 text-indigo-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-slate-700 truncate">${esc(f.name)}</div>
        <div class="text-xs text-slate-400">${fmtBytes(f.size||0)} · ${new Date(f.uploadedAt).toLocaleDateString('it-IT')}</div>
      </div>
      <a href="${f.dataUrl}" download="${esc(f.name)}" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium">Scarica</a>
      <button type="button" onclick="removeFile(${i})" class="text-red-400 hover:text-red-600 p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  `).join('');
}
function handleFileDrop(e) {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files) processFiles(e.dataTransfer.files);
}
function handleFileSelect(e) {
  processFiles(e.target.files);
  e.target.value = '';
}
function processFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      formFiles.push({
        name: file.name,
        type: file.type,
        size: file.size,
        dataUrl: ev.target.result,
        uploadedAt: new Date().toISOString()
      });
      persistFilesOnDeal();
      renderFilesList();
    };
    reader.readAsDataURL(file);
  });
}
function removeFile(i) { formFiles.splice(i,1); persistFilesOnDeal(); renderFilesList(); }
function persistFilesOnDeal() {
  if (!editingDeal) return;
  try {
    deals = loadDeals();
    const idx = deals.findIndex(d => d.id === editingDeal.id);
    if (idx >= 0) { deals[idx].files = JSON.parse(JSON.stringify(formFiles)); saveDeals(deals); editingDeal = deals[idx]; }
  } catch (err) {
    alert('Errore salvataggio file: ' + err.message + '\nProbabilmente hai raggiunto il limite di localStorage.');
  }
}

    contactName: g('contactName'), contactEmail: g('contactEmail'), contactLinkedin: g('contactLinkedin'),
    relationship: g('relationship'),
    ticketMin: parseFloat(fd.get('ticketMin'))||0,
    ticketMax: parseFloat(fd.get('ticketMax'))||0,
    trlMin: gi('trlMin')||1, trlMax: gi('trlMax')||9,
    portfolioCount: gi('portfolioCount'),
    stages: fd.getAll('stages'), sectors: fd.getAll('sectors'),
    geographies: fd.getAll('geographies'), instruments: fd.getAll('instruments'),
    leadInvestor: fd.get('leadInvestor')==='1',
    coInvestmentInterest: fd.get('coInvestmentInterest')==='1',
    boardSeat: fd.get('boardSeat')==='1',
    portfolioNotes: g('portfolioNotes'), notes: g('notes')
  };
  const list = loadInvestors();

  if (idx >= 0) list[idx] = inv; else list.push(inv);
  saveInvestors(list);

function deleteInvestor(id) {
  const list = loadInvestors();
  const inv = list.find(x => x.id === id);
  if (!inv) return;
  if (confirm(`Eliminare "${inv.name}"?`)) {
    saveInvestors(list.filter(x => x.id !== id));
    renderInvestors();
  }
}

function computeInvestorMatch(deal, inv) {
  const details = [];
  let score = 0;

  // Settore (30 pt)
  const sectorMatch = (inv.sectors || []).includes(deal.sector);
  if (sectorMatch) { score += 30; details.push({ ok: true,  label: 'Settore', note: deal.sector + ' è tra i settori del fondo' }); }
  else             {              details.push({ ok: false, label: 'Settore', note: (inv.sectors||[]).join(', ') || '—' }); }

  // TRL (25 pt)
  const trl = deal.trl || 0;
  const trlMin = inv.trlMin || 1, trlMax = inv.trlMax || 9;
  const trlMatch = trl >= trlMin && trl <= trlMax;
  if (trlMatch) { score += 25; details.push({ ok: true,  label: 'TRL', note: `TRL ${trl} è nel range ${trlMin}–${trlMax}` }); }
  else          {              details.push({ ok: false, label: 'TRL', note: `TRL ${trl} fuori dal range ${trlMin}–${trlMax}` }); }

  // Stage (20 pt) — mappa deal stage → termini usati dagli investitori
  const stageMap = { 'Sourcing': 'Seed', 'Due Diligence': 'Seed', 'Term Sheet': 'Series A', 'Closed': 'Series A', 'Rejected': null };
  const dealStageKey = stageMap[deal.stage] || deal.stage;
  const stageMatch = (inv.stages || []).some(s => s === dealStageKey || s.toLowerCase().includes(dealStageKey.toLowerCase()));
  if (stageMatch) { score += 20; details.push({ ok: true,  label: 'Stage', note: `${deal.stage} compatibile con ${(inv.stages||[]).join(', ')}` }); }
  else            {              details.push({ ok: false, label: 'Stage', note: `Stage preferiti: ${(inv.stages||[]).join(', ')}` }); }

  // Ticket (15 pt)
  const amount = deal.investmentAmount || 0;
  const ticketMin = inv.ticketMin || 0, ticketMax = inv.ticketMax || Infinity;
  const ticketMatch = amount > 0 && amount >= ticketMin && amount <= ticketMax;
  const fmt = n => n ? '€'+Number(n).toLocaleString('it-IT') : '—';
  if (ticketMatch)     { score += 15; details.push({ ok: true,  label: 'Ticket', note: `${fmt(amount)} nel range ${fmt(ticketMin)}–${fmt(ticketMax)}` }); }
  else if (amount > 0) {              details.push({ ok: false, label: 'Ticket', note: `${fmt(amount)} fuori dal range ${fmt(ticketMin)}–${fmt(ticketMax)}` }); }
  else                 {              details.push({ ok: null,  label: 'Ticket', note: 'Importo non specificato nel deal' }); }

  // Status relazione (10 pt)
  const statusScores = { 'Warm': 10, 'Partner': 10, 'In valutazione': 5, 'Cold': 0 };
  const statusPts = statusScores[inv.status] || 0;
  score += statusPts;
  details.push({ ok: statusPts > 0, label: 'Relazione', note: inv.status + (statusPts > 0 ? ' — contatto già avviato' : ' — da scaldare') });

  return { score, pct: Math.round(score), details };
}

}
function addPortfolioMilestone() { portfolioMilestones.push({title:'',targetDate:'',done:false}); renderPortfolioMilestonesList(); }

function renderPortfolioFilesList() {
  const el = document.getElementById('port-files-list');
  if (!el) return;
  if (!portfolioFiles.length) { el.innerHTML = '<p class="text-sm text-slate-400 italic">Nessun documento</p>'; return; }
  el.innerHTML = portfolioFiles.map((f,i) => `
    <div class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg mb-2">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-slate-700 truncate">${esc(f.name)}</div>
        <div class="text-xs text-slate-400">${fmtBytes(f.size||0)}</div>
      </div>
      <a href="${f.dataUrl}" download="${esc(f.name)}" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded">Scarica</a>
      <button type="button" onclick="portfolioFiles.splice(${i},1); renderPortfolioFilesList()" class="text-red-400 hover:text-red-600 p-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>`).join('');
}
function handlePortFileDrop(e) { e.preventDefault(); if (e.dataTransfer) processPortFiles(e.dataTransfer.files); }
function handlePortFileSelect(e) { processPortFiles(e.target.files); e.target.value=''; }
function processPortFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      portfolioFiles.push({ name:file.name, type:file.type, size:file.size, dataUrl:ev.target.result, uploadedAt:new Date().toISOString() });
      renderPortfolioFilesList();
    };
    reader.readAsDataURL(file);
  });
}

function savePortfolioEntry(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const g = n => fd.get(n)||'';
  const gf = n => parseFloat(fd.get(n))||0;
  const entry = {
    id: editingPortfolio ? editingPortfolio.id : 'port-'+Date.now(),
    company: g('company'), sector: g('sector'), description: g('description'),
    investmentDate: g('investmentDate'), investmentAmount: gf('investmentAmount'),
    instrument: g('instrument'), ourPercent: gf('ourPercent'),
    postMoneyValuation: gf('postMoneyValuation'), currentValuation: gf('currentValuation'),
    coInvestors: portfolioCoInvestors,
    status: g('status'), exitDate: g('exitDate'),
    exitMultiple: parseFloat(fd.get('exitMultiple'))||null,
    lastRevenueARR: gf('lastRevenueARR'), burnRate: gf('burnRate'),
    runway: gf('runway'), employees: gf('employees'),
    lastUpdateDate: g('lastUpdateDate'),
    milestones: portfolioMilestones,
    files: portfolioFiles,
    boardMeetingNotes: g('boardMeetingNotes'), notes: g('notes')
  };
  const list = loadPortfolio();
  const idx = list.findIndex(x => x.id === entry.id);
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  savePortfolio(list);
  navigate('portfolio');
}

function deletePortfolio(id) {
  const list = loadPortfolio();
  const p = list.find(x => x.id === id);
  if (!p) return;
  if (confirm('Eliminare "' + p.company + '"?')) { savePortfolio(list.filter(x=>x.id!==id)); renderPortfolio(); }
}

function saveIndustry(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const g = n => fd.get(n)||'';
  const entry = {
    id: id || 'ind-'+Date.now(),
    name: g('name'), sector: g('sector'), size: g('size'),
    country: g('country'), city: g('city'),
    contactName: g('contactName'), contactEmail: g('contactEmail'), contactLinkedin: g('contactLinkedin'),
    relationshipType: g('relationshipType'), relationshipStatus: g('relationshipStatus'),
    validations: industryValidations,
    industrialNeeds: industryNeeds,
    notes: g('notes')
  };
  const list = loadIndustries();
  const idx = list.findIndex(x => x.id === id);
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  saveIndustries(list);
  closeIndustryModal();
  renderIndustries();
}

function deleteIndustry(id) {
  const list = loadIndustries();
  const ind = list.find(x => x.id === id);
  if (!ind) return;
  if (confirm('Eliminare "' + ind.name + '"?')) { saveIndustries(list.filter(x=>x.id!==id)); renderIndustries(); }
}

function saveTeamMember(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const team = loadTeam();
  const fields = {
    name: fd.get('name'),
    email: fd.get('email'),
    role: fd.get('role'),
    status: fd.get('status'),
    username: (fd.get('username')||'').trim(),
    password: fd.get('password')||'',
    canLogin: fd.get('canLogin') === '1'
  };
  if (id) {
    const idx = team.findIndex(x => x.id === id);
    if (idx >= 0) team[idx] = { ...team[idx], ...fields };
  } else {
    team.push({ id: 'tm-'+Date.now(), ...fields });
  }
  saveTeam(team);
  closeTeamModal();
  renderTeam();
}
function toggleTeamStatus(id) {
  const team = loadTeam();
  const m = team.find(x => x.id === id);
  if (!m) return;
  if (m.status === 'Active') m.status = 'Invited';
  else m.status = 'Active';
  saveTeam(team);
  renderTeam();
}
function deleteTeamMember(id) {
  const team = loadTeam();
  const m = team.find(x => x.id === id);
  if (!m) return;
  if (confirm(`Eliminare il membro "${m.name}"?`)) {
    saveTeam(team.filter(x => x.id !== id));
    renderTeam();
  }
}

const SESSION_KEY = 'dealflow_session';
function currentUser() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; }
}
function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  // Ensure team is seeded so admin/admin works on first launch
  const team = loadTeam();
  const member = team.find(m => m.canLogin && m.status !== 'Inactive' && m.username === u && m.password === p);
  if (!member) {
    document.getElementById('login-error').classList.remove('hidden');
    return;
  }
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ id: member.id, name: member.name, role: member.role, username: member.username }));
  document.getElementById('login-error').classList.add('hidden');
  document.getElementById('login-password').value = '';
  showApp();
}
function doLogout() {
  sessionStorage.removeItem(SESSION_KEY);
  showLogin();
}
function showLogin() {
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('sidebar').classList.add('hidden');
  document.querySelector('main').classList.add('hidden');
}
function showApp() {
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('sidebar').classList.remove('hidden');
  document.querySelector('main').classList.remove('hidden');
  const u = currentUser();
  const el = document.getElementById('sidebar-user');
  if (u && el) el.textContent = u.name + ' · ' + u.role;
  generateDueSoonNotifications();
  refreshNotifBadge();
  renderPipeline();
}

// INIT
// ============================================================
// Ensure tasks/files arrays exist on existing deals
deals = loadDeals();
let _migrated = false;
deals.forEach(d => {
  if (!d.tasks) { d.tasks = []; _migrated = true; }
  if (!d.files) { d.files = []; _migrated = true; }
  if (!d.researchers) { d.researchers = []; _migrated = true; }
  if (!d.comments) { d.comments = []; _migrated = true; }
  if (!d.createdAt) { d.createdAt = new Date().toISOString(); _migrated = true; }
  if (!d.concept) { d.concept = { fields:{}, approvals:{}, comments:{}, validationStatus:{} }; _migrated = true; }
  if (!d.evaluation) { d.evaluation = { marketValidated: false, marketValidationHow:'', prototypePerformanceText:'', secondary:{}, comments:{} }; _migrated = true; }
  // Migrate legacy tasks without criterion key
  (d.tasks || []).forEach(t => {
    if (!t.criterion) { t.criterion = 'industrialNeed'; _migrated = true; }
  });
});
if (_migrated) saveDeals(deals);
// Seed team & migrate existing team members to include auth fields
let team = loadTeam();
let _teamMigrated = false;
team.forEach(m => {
  if (m.username === undefined) { m.username = ''; _teamMigrated = true; }
  if (m.password === undefined) { m.password = ''; _teamMigrated = true; }
  if (m.canLogin === undefined) { m.canLogin = false; _teamMigrated = true; }
});
// Ensure admin demo user exists for first-time login on existing installs
if (!team.some(m => m.username === 'admin')) {
  team.unshift({ id: 'tm-admin', name: 'Admin Demo', email: 'admin@fondo.it', role: 'Partner', status: 'Active', username: 'admin', password: 'admin', canLogin: true });
  _teamMigrated = true;
}
if (_teamMigrated) saveTeam(team);

// Seed demo notifications for admin on first load
(function seedDemoNotifications() {
  if (localStorage.getItem(NOTIF_KEY)) return;
  const admin = team.find(m => m.username === 'admin');
  if (!admin) return;
  const firstDeal = (loadDeals()[0] || {});
  const demo = [
    {
      id: 'n-demo-1', userId: admin.id, type: 'mention',
      title: 'Sei stato menzionato',
      body: `Marco Bianchi ti ha menzionato in un commento su ${firstDeal.company||'un deal'} (Bisogno Industriale): "@admin puoi confermare il piano industriale?"`,
      dealId: firstDeal.id || null, criterion: 'industrialNeed',
      read: false, timestamp: new Date(Date.now() - 60*60*1000).toISOString()
    },
    {
      id: 'n-demo-2', userId: admin.id, type: 'task_assigned',
      title: 'Nuovo task assegnato',
      body: `Ti è stato assegnato un task "Verificare brevetti depositati" su ${firstDeal.company||'un deal'}.`,
      dealId: firstDeal.id || null, criterion: 'ip',
      read: false, timestamp: new Date(Date.now() - 30*60*1000).toISOString()
    }
  ];
  saveNotifications(demo);
})();

if (currentUser()) showApp(); else showLogin();
</script>
